name: Deploy web explorer to GitHub Pages

# Publishes the client-side SPARQL explorer in web/ (index.html + vendored
# Oxigraph WASM + data.nq.gz) to GitHub Pages. The dataset is committed as a
# gzipped snapshot, so no build step is needed — this just uploads web/.

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
