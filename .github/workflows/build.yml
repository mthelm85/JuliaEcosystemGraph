name: Rebuild ecosystem graph

# Two jobs: crawl (5h) then render (~15 min).  If render fails, use
# "Re-run failed jobs" from the Actions UI — the crawl is skipped and
# its artifact is reused, so iteration on render issues takes minutes.
#
# Usage: Actions → "Rebuild ecosystem graph" → Run workflow
#
# Requires a repository secret named GH_API_TOKEN — a fine-grained PAT with:
#   • Contents: read/write (push the updated data)
#   • Public repositories: read (pipeline API calls)

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: >
          Pin the snapshot date (YYYY-MM-DD).  Leave blank for today.
          Set to a previous date to reuse cached crawl data.
        required: false
        default: ''
  # schedule:
  #   - cron: '0 6 * * 0'   # weekly, Sunday 06:00 UTC

permissions:
  contents: write

concurrency:
  group: build-graph
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════════
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 420      # 7 hours — contributor crawl takes ~5h

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - uses: julia-actions/cache@v2

      - name: Instantiate project
        run: julia --project -e 'using Pkg; Pkg.instantiate()'

      - name: Restore pipeline cache
        uses: actions/cache@v4
        with:
          path: |
            out
            julia_ecosystem.nq
          key: pipeline-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pipeline-${{ runner.os }}-

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          KG_SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
        run: julia --project -t auto scripts/build.jl

      - name: Verify graph
        run: |
          if [ ! -s julia_ecosystem.nq ]; then
            echo "::error::julia_ecosystem.nq is empty or missing"
            exit 1
          fi
          echo "Graph size: $(wc -l < julia_ecosystem.nq) lines, $(du -h julia_ecosystem.nq | cut -f1)"

      - name: Upload graph
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-graph
          path: julia_ecosystem.nq
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════
  render:
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_API_TOKEN }}

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - uses: julia-actions/cache@v2

      # All deps (including DataFrames, Statistics, IJulia) are in the
      # committed Manifest — one instantiate installs everything.
      - name: Install project dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Precompile notebook packages
        run: julia --project -e 'using RDF, Graphs, DataFrames, Statistics, Dates; import JSON'

      - name: Download graph
        uses: actions/download-artifact@v4
        with:
          name: ecosystem-graph

      - name: Verify graph
        run: |
          if [ ! -s julia_ecosystem.nq ]; then
            echo "::error::Downloaded graph is empty — crawl may not have produced valid data"
            exit 1
          fi
          echo "Graph: $(wc -l < julia_ecosystem.nq) lines"

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Register Jupyter kernel
        run: |
          pip install jupyter
          julia --project -e '
            using IJulia
            installkernel("Julia", "--project=$(ENV["GITHUB_WORKSPACE"])", "--compiled-modules=existing")
          '
          jupyter kernelspec list

      - name: Render notebook
        env:
          QUARTO_PYTHON: /usr/bin/python3
        run: |
          SUBTITLE="Dependency structure, contributor data, and maintenance signals from the General registry, $(date -u +'%-d %B %Y')"
          quarto render notebook/ecosystem_insights.qmd --metadata "subtitle:$SUBTITLE"

      - name: Update web assets
        run: |
          cp notebook/ecosystem_insights.html web/index.html
          gzip -9 -k -f julia_ecosystem.nq
          mv julia_ecosystem.nq.gz web/data.nq.gz

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html web/data.nq.gz
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh ecosystem graph ($(date -u +%Y-%m-%d))"
            git push
          fi
